<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" type="image/x-icon" href="/imgs/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/105633963c.js"
      crossorigin="anonymous"
    ></script>
    {% block head_script %}{% endblock %}

    <title>CodeWhiz</title>
  </head>
  <body class="bg-gray-900">
    <nav class="fixed top-0 z-50 w-full border-b bg-gray-900 border-gray-700">
      <div class="px-3 py-2">
        <div class="flex items-center justify-between">
          <div class="flex items-center justify-start rtl:justify-end">
            <button
              type="button"
              id="homebtn"
              onclick="location.href = '/welcome'"
              class="inline-flex items-center px-2 py-4 text-sm text-gray-500 rounded-lg hover:bg-gray-100 focus:outline-none hover:bg-gray-700 focus:ring-gray-600"
            >
              <i class="fa-solid fa-house fa-lg text-white"></i>
            </button>
            <button
              type="button"
              id="sidebtn"
              class="inline-flex items-center p-2 text-sm text-gray-500 rounded-lg hover:bg-gray-100 focus:outline-none hover:bg-gray-700 focus:ring-gray-600"
            >
              <div
                class="border-2 border-white rounded w-5 h-4 flex flex-row items-center"
              >
                <div
                  class="border-r-2 border-white w-2/5 h-full bg-white flex flex-col justify-center items-center transition-all"
                  id="sidebtnline"
                ></div>
              </div>
            </button>
          </div>
          <div class="flex-grow flex justify-center">
            <button
              class="bg-[#f12b18] hover:bg-red-800 text-white font-bold p-2 rounded"
              id="runbtn"
            >
              <i class="fa-solid fa-play pr-2"></i>Run
            </button>
          </div>
          <div class="flex items-center">
            <div class="flex items-center ms-3">
              <div>
                <a
                  class="flex text-sm bg-gray-900 rounded-full cursor-pointer"
                  aria-expanded="false"
                  data-dropdown-toggle="dropdown-user"
                >
                  <i class="fa-solid fa-circle-user fa-2xl text-white"></i>
                </a>
              </div>
              <div
                class="z-50 hidden my-4 text-base list-none divide-y rounded shadow bg-gray-700 divide-gray-600"
                id="dropdown-user"
              >
                <div class="px-4 py-3" role="none">
                  <p
                    class="text-sm font-medium text-gray-900 truncate dark:text-gray-300"
                    role="none"
                  >
                    {{ email }}
                  </p>
                </div>
                <ul class="py-1" role="none">
                  <li>
                    <a
                      href="/logout"
                      class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-600 dark:hover:text-white"
                      role="menuitem"
                      >Logout</a
                    >
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="flex flex-row">
      <aside
        id="sidebar"
        class="fixed top-0 left-0 z-40 w-64 h-screen pt-20 transition-transform border-r bg-gray-900 border-gray-700"
      >
        <div class="h-full px-3 pb-4 overflow-y-auto bg-gray-900">
          <h2 class="text-lg font-bold mb-4 text-white">Files</h2>
          {% block sidebar %}{% endblock %}
        </div>
      </aside>
      <main id="mainContainer" class="sidebar-on">
        {% block content %}{% endblock %}
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script src="/js/baseauth.js"></script>

    {% block end_script %}{% endblock %}
  </body>
</html>
