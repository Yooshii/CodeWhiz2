      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/105633963c.js"
      crossorigin="anonymous"
    ></script>
    {% block head_script %}{% endblock %}

    <title>CodeWhiz</title>
  </head>

    <nav class="fixed top-0 z-50 w-full border-b bg-gray-900 border-gray-700">
      <div class="px-3 py-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center justify-start rtl:justify-end">
            <button
              type="button"
              id="sidebtn"
              class="inline-flex items-center p-2 text-sm text-gray-500 rounded-lg hover:bg-gray-100 focus:outline-none hover:bg-gray-700 focus:ring-gray-600"
            >
              <div
                class="border-2 border-white rounded w-5 h-4 flex flex-row items-center"
              >
                <div
                  class="border-r-2 border-white w-2/5 h-full bg-white flex flex-col justify-center items-center transition-all"
                  id="sidebtnline"
                ></div>
              </div>
            </button>
            <a href="/welcome" class="flex ms-2">
              <img src="/imgs/logo.png" class="h-6" />
            </a>
          </div>
          <div class="flex items-center">
            <div class="flex items-center ms-3">
              <div>
                <a
                  class="flex text-sm bg-gray-900 rounded-full cursor-pointer"
                  aria-expanded="false"
                  data-dropdown-toggle="dropdown-user"
                >
                  <i class="fa-solid fa-circle-user fa-2xl text-white"></i>
                </a>
              </div>
              <div
                class="z-50 hidden my-4 text-base list-none divide-y rounded shadow bg-gray-700 divide-gray-600"
                id="dropdown-user"
              >
                <div class="px-4 py-3" role="none">
                  <p
                    class="text-sm font-medium text-gray-900 truncate dark:text-gray-300"
                    role="none"
                  >
                    {{ email }}
                  </p>
                </div>
                <ul class="py-1" role="none">
                  <li>
                    <a
                      href="/logout"
                      class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-600 dark:hover:text-white"
                      role="menuitem"
                      >Logout</a
                    >
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="flex flex-row">
      <aside
        id="sidebar"
        class="fixed top-0 left-0 z-40 w-64 h-screen pt-20 transition-transform border-r bg-gray-900 border-gray-700"
      >
        <div class="h-full px-3 pb-4 overflow-y-auto bg-gray-900">
          <ul class="space-y-2 font-medium">
            <li>
              <a
                href="/welcome"
                class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
              >
                <i
                  class="fa-solid fa-house fa-lg transition duration-75 text-gray-400 group-hover:text-white"
                ></i>
                <span class="ms-3">Home</span>
              </a>
            </li>
            <li>
              <a
                href="/quiz"
                class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
              >
                <i
                  class="fa-solid fa-circle-question fa-lg transition duration-75 text-gray-400 group-hover:text-white"
                ></i>
                <span class="flex-1 ms-3 whitespace-nowrap">Quiz</span>
                <!-- <span
                  class="inline-flex items-center justify-center px-2 ms-3 text-sm font-medium text-gray-800 bg-gray-100 rounded-full dark:bg-gray-700 dark:text-gray-300"
                  >Pro</span
                > -->
              </a>
            </li>
            <li>
              <a
                href="/welcome#scores"
                class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
              >
                <i
                  class="fa-solid fa-star fa-lg transition duration-75 text-gray-400 group-hover:text-white"
                ></i>
                <span class="flex-1 ms-3 whitespace-nowrap">Scores</span>
                <!-- <span
                  class="inline-flex items-center justify-center w-3 h-3 p-3 ms-3 text-sm font-medium text-blue-800 bg-blue-100 rounded-full dark:bg-blue-900 dark:text-blue-300"
                  >3</span
                > -->
              </a>
            </li>
            <li>
              <a
                href="/leaderboard"
                class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
              >
                <i
                  class="fa-solid fa-ranking-star fa-lg transition duration-75 text-gray-400 group-hover:text-white"
                ></i>
                <span class="flex-1 ms-3 whitespace-nowrap">Leaderboard</span>
                <!-- <span
                  class="inline-flex items-center justify-center w-3 h-3 p-3 ms-3 text-sm font-medium text-blue-800 bg-blue-100 rounded-full dark:bg-blue-900 dark:text-blue-300"
                  >3</span
                > -->
              </a>
            </li>
            <li>
              <a
                class="flex items-center w-full p-2 text-base text-gray-900 transition duration-75 rounded-lg group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700 cursor-pointer"
                aria-controls="dropdown-example"
                data-collapse-toggle="dropdown-example"
              >
                <i
                  class="fa-solid fa-code fa-lg transition duration-75 text-gray-400 group-hover:text-white"
                ></i>
                <span
                  class="flex-1 ms-3 text-left rtl:text-right whitespace-nowrap"
                  >CodeEditor</span
                >
                <i class="fa-solid fa-chevron-down fa-sm"></i>
              </a>
              <ul id="dropdown-example" class="hidden py-2 space-y-2">
                <li>
                  <a
                    href="/pycodeeditor"
                    class="flex items-center w-full p-2 text-gray-900 transition duration-75 rounded-lg pl-11 group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700"
                    >Python</a
                  >
                </li>
                <li>
                  <a
                    href="/webcodeeditor"
                    class="flex items-center w-full p-2 text-gray-900 transition duration-75 rounded-lg pl-11 group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700"
                    >WebDev</a
                  >
                </li>
              </ul>
            </li>
            <!-- <li>
              <a
                href="/chat"
                class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
              >
                <i class="fa-solid fa-comments fa-lg transition duration-75 text-gray-400 group-hover:text-white"></i>
                <span class="flex-1 ms-3 whitespace-nowrap">Chat</span>
              </a>
            </li> -->
          </ul>
          <ul
            class="pt-4 mt-4 space-y-2 font-medium border-t border-gray-200 dark:border-gray-700"
          >
            <li>
              <a
                href="/portfolio"
                class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
              >
                <i
                  class="fa-solid fa-address-card fa-lg transition duration-75 text-gray-400 group-hover:text-white"
                ></i>
                <span class="flex-1 ms-3 whitespace-nowrap">About Creator</span>
              </a>
            </li>
          </ul>
        </div>
      </aside>
      <main id="mainContainer" class="sidebar-on">
        {% block content %}{% endblock %}
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script src="/js/baseauth.js"></script>

    {% block end_script %}{% endblock %}
  </body>
</html>
