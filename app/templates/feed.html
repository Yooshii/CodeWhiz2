{% extends "baseauth.html" %} 
{% block title %} Posts - CodeWhiz {% endblock %}
{% block head_script %}
<script src="https://cdn.tailwindcss.com"></script>
{% endblock %} 
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-6 dark:bg-gray-900">
  <div class="bg-gray-800 shadow-md rounded-lg p-4 mt-16 mb-6">
      <textarea 
          id="postContent" 
          rows="4" 
          class="w-full border border-gray-600 rounded-lg p-3 text-gray-200 focus:outline-none focus:ring focus:ring-blue-300 bg-gray-700"
          placeholder="What's on your mind?"
      ></textarea>
      <div class="mt-4 text-right">
          <button 
              onclick="createPost()" 
              class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition"
          >
              Post
          </button>
      </div>
  </div>

  <div id="postsContainer" class="space-y-4">
  </div>
</div>
{% endblock %} 
{% block end_script %}
<script src="/js/feed.js"></script>
{% endblock %}
